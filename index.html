const WDAYS = ['일','월','화','수','목','금','토'];
function kst() {
  const now = new Date();
  const utc = now.getTime() + now.getTimezoneOffset() * 60000;
  return new Date(utc + 9 * 3600000);
}
function kstDateStr() {
  const k = kst();
  return `${k.getFullYear()}-${String(k.getMonth()+1).padStart(2,'0')}-${String(k.getDate()).padStart(2,'0')}`;
}
function d(s) { return new Date(s + 'T00:00:00+09:00'); }
function fmt(s) {
  const dt = d(s);
  return `${dt.getMonth()+1}/${dt.getDate()}(${WDAYS[dt.getDay()]})`;
}
function money(n) { if (!n) return '-'; return '₩' + n.toLocaleString('ko-KR'); }
function isCancelled(r) { return r.note.startsWith('취소'); }
function isDone(r) { return r.note.startsWith('퇴실완료'); }
function platBadge(p) {
  if (p === '삼삼엠투')    return `<span class="badge b-33m2">삼삼엠투</span>`;
  if (p === '리브애니웨어') return `<span class="badge b-live">리브애니웨어</span>`;
  return `<span class="badge b-ext">${p}</span>`;
}
function platClass(p) {
  if (p === '삼삼엠투')    return 'tc-33m2';
  if (p === '리브애니웨어') return 'tc-live';
  return 'tc-ext';
}

let alertsLoaded = false;
let calRendered  = false;
function switchTab(el) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  el.classList.add('active');
  const name = el.dataset.panel;
  document.getElementById('panel-' + name).classList.add('active');
  if (name === 'alerts' && !alertsLoaded) loadAlerts();
  if (name === 'cal'    && !calRendered)  { calRendered = true; renderCalendar(); }
  if (name === 'clean')                   renderCleaningSchedule();
}

function renderCalendar() {
  const YEAR = 2026;
  const DAY_W = 28;
  const ROW_H = 40;
  const MONTHS_KR = ['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
  const ROOMS_ORDER = ['속초금호','영주순흥','동해묵호','여수당머리','단양어상천','단양단성','봉화춘양','여수남산','제주함덕','전주완산'];
  const extraRooms = [...new Set(RS_CAL.map(r => r.room))].filter(r => !ROOMS_ORDER.includes(r));
  const ROOMS = [...ROOMS_ORDER, ...extraRooms];

  const days = [];
  for (let m = 0; m < 12; m++) {
    const dim = new Date(YEAR, m + 1, 0).getDate();
    for (let day = 1; day <= dim; day++) {
      days.push({ m, day, dow: new Date(YEAR, m, day).getDay(), isLast: day === dim });
    }
  }
  const totalW = days.length * DAY_W;
  const todayStr = kstDateStr();

  function dayIdx(s) {
    const dt = new Date(s + 'T00:00:00');
    return Math.round((dt - new Date(YEAR, 0, 1)) / 86400000);
  }

  function barColor(r) {
    if (isCancelled(r)) return { bg: '#e5e7eb', txt: '#9ca3af' };
    if (isDone(r))      return { bg: '#94a3b8', txt: '#fff' };
    if (r.note === '예약요청중') return { bg: '#ef4444', txt: '#fff' };
    if (r.p === '삼삼엠투')    return { bg: '#7c3aed', txt: '#fff' };
    if (r.p === '리브애니웨어') return { bg: '#0d9488', txt: '#fff' };
    return { bg: '#374151', txt: '#fff' };
  }

  let lbl = `<div class="cal-label-hdr">지점</div>`;
  for (const room of ROOMS) {
    lbl += `<div class="cal-label-row" title="${room}">${room}</div>`;
  }

  let mHdr = ``;
  for (let m = 0; m < 12; m++) {
    const dim = new Date(YEAR, m + 1, 0).getDate();
    mHdr += `<div class="cal-month-cell" style="width:${dim * DAY_W}px">${MONTHS_KR[m]}</div>`;
  }

  let dHdr = ``;
  for (const { m, day, dow, isLast } of days) {
    const ds = `${YEAR}-${String(m + 1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    const isWkd   = dow === 0 || dow === 6;
    const isToday = ds === todayStr;
    const cls = ['cal-day-cell', isWkd ? 'weekend' : '', isToday ? 'is-today' : ''].filter(Boolean).join(' ');
    dHdr += `<div class="${cls}" style="width:${DAY_W}px">${day}</div>`;
  }

  let rows = ``;
  const todayIdx = dayIdx(todayStr);

  for (const room of ROOMS) {
    let bgCells = ``;
    for (const { m, day, dow, isLast } of days) {
      const ds = `${YEAR}-${String(m + 1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
      const isWkd   = dow === 0 || dow === 6;
      const isToday = ds === todayStr;
      const cls = ['cal-cell', isWkd ? 'weekend' : '', isToday ? 'is-today' : '', isLast ? 'month-end' : ''].filter(Boolean).join(' ');
      bgCells += `<div class="${cls}" style="width:${DAY_W}px"></div>`;
    }

    const todayLineL = todayIdx >= 0 ? todayIdx * DAY_W + DAY_W / 2 : -999;
    const todayLine = todayIdx >= 0 && todayIdx < days.length
      ? `<div class="cal-today-line" style="left:${todayLineL}px"></div>` : '';

    let bars = ``;
    const roomRS = RS_CAL.filter(r => r.room === room && !isCancelled(r));
    for (const r of roomRS) {
      const s = dayIdx(r.in);
      const e = dayIdx(r.out);
      const cs = Math.max(0, s);
      const ce = Math.min(days.length, e);
      if (ce <= cs) continue;

      const { bg, txt } = barColor(r);
      const barW  = (ce - cs) * DAY_W - 3;
      const barL  = cs * DAY_W + 1;
      const label = `${r.guest}${r.note === '이메일확인' ? ' ✉' : ''}${r.note === '예약요청중' ? ' ⚠️' : ''}`;
      const amtStr = r.amt ? `₩${r.amt.toLocaleString('ko-KR')}` : '-';
      const tipHTML = `${r.room} · ${r.guest}<br>${r.in} ~ ${r.out}<br>${r.p} · ${amtStr}${r.note ? '<br>' + r.note : ''}`;

      bars += `<div class="cal-bar"
        style="left:${barL}px; width:${barW}px; background:${bg};"
        onmouseenter="showCalTip(event,'${tipHTML}')"
        onmouseleave="hideCalTip()">
        <span class="cal-bar-txt" style="color:${txt}">${label}</span>
      </div>`;
    }

    rows += `<div class="cal-row" style="width:${totalW}px">
      <div class="cal-row-bg">${bgCells}</div>
      ${todayLine}
      ${bars}
    </div>`;
  }

  document.getElementById('cal-content').innerHTML = `
    <div class="cal-wrap">
      <div class="cal-labels">${lbl}</div>
      <div class="cal-scroll" id="cal-scroll">
        <div class="cal-inner" style="width:${totalW}px">
          <div class="cal-month-hdr">${mHdr}</div>
          <div class="cal-day-hdr">${dHdr}</div>
          ${rows}
        </div>
      </div>
    </div>
    <div style="margin-top:10px; font-size:11px; color:#bbb; display:flex; gap:16px; flex-wrap:wrap">
      <span><span style="display:inline-block;width:12px;height:12px;border-radius:3px;background:#7c3aed;vertical-align:middle;margin-right:4px"></span>삼삼엠투</span>
      <span><span style="display:inline-block;width:12px;height:12px;border-radius:3px;background:#0d9488;vertical-align:middle;margin-right:4px"></span>리브애니웨어</span>
      <span><span style="display:inline-block;width:12px;height:12px;border-radius:3px;background:#374151;vertical-align:middle;margin-right:4px"></span>직계약/연장/기타</span>
      <span><span style="display:inline-block;width:12px;height:12px;border-radius:3px;background:#94a3b8;vertical-align:middle;margin-right:4px"></span>퇴실완료</span>
      <span><span style="display:inline-block;width:12px;height:12px;border-radius:3px;background:#ef4444;vertical-align:middle;margin-right:4px"></span>예약요청중</span>
    </div>
    <div id="cal-tip" class="cal-tooltip"></div>`;

  const scroll = document.getElementById('cal-scroll');
  if (scroll && todayIdx > 0) {
    scroll.scrollLeft = Math.max(0, todayIdx * DAY_W - scroll.clientWidth / 3);
  }
}

function showCalTip(e, html) {
  const tip = document.getElementById('cal-tip');
  if (!tip) return;
  tip.innerHTML = html.replace(/<br>/g, '\n').replace(/\n/g, '<br>');
  tip.style.display = 'block';
  tip.style.left = (e.clientX + 12) + 'px';
  tip.style.top  = (e.clientY - 10) + 'px';
}
function hideCalTip() {
  const tip = document.getElementById('cal-tip');
  if (tip) tip.style.display = 'none';
}

// ════════════════════════════════════════════════════════════════════════════
// 청소 일정 체크박스 (localStorage 유지)
// ════════════════════════════════════════════════════════════════════════════
function cleanKey(room, outDate) { return 'clean_' + room + '_' + outDate; }
function toggleClean(cb) {
  try { localStorage.setItem(cb.dataset.key, cb.checked ? '1' : '0'); } catch(e) {}
  const item = cb.closest('.clean-item');
  if (item) item.classList.toggle('done', cb.checked);
}
function isCleanDone(room, outDate) {
  try { return localStorage.getItem(cleanKey(room, outDate)) === '1'; } catch(e) { return false; }
}

function renderCleaningSchedule() {
  const todayStr = kstDateStr();
  const todayD   = d(todayStr);
  const week7D   = new Date(todayD.getTime() + 7 * 86400000);

  // All non-cancelled (including 퇴실완료) — find upcoming checkouts from today
  const nonCancelled = RS.filter(r => !isCancelled(r));

  const tasks = [];
  for (const r of nonCancelled) {
    const outD = d(r.out);
    if (outD < todayD) continue;  // only today onwards

    // Next non-cancelled reservation for same room after this checkout
    const next = nonCancelled
      .filter(s => s.room === r.room && s !== r && d(s.in) >= outD)
      .sort((a, b) => d(a.in) - d(b.in))[0];

    const gapDays = next ? Math.round((d(next.in) - outD) / 86400000) : null;
    const isThisWeek = outD <= week7D;
    tasks.push({ room: r.room, outDate: r.out, nextIn: next ? next.in : null, gapDays, outGuest: r.guest, inGuest: next ? next.guest : null, isThisWeek });
  }
  tasks.sort((a, b) => a.outDate.localeCompare(b.outDate));

  const el = document.getElementById('clean-content');
  if (!tasks.length) { el.innerHTML = '<div class="empty" style="padding:16px">예정된 청소 일정 없음</div>'; return; }

  // Split into this week vs later
  const thisWeek = tasks.filter(t => t.isThisWeek);
  const later    = tasks.filter(t => !t.isThisWeek);

  function renderGroup(list, title) {
    if (!list.length) return '';
    let html = `<div class="clean-section">
      <div class="clean-section-hdr">${title}</div>`;
    for (const t of list) {
      const done = isCleanDone(t.room, t.outDate);
      const key  = cleanKey(t.room, t.outDate);
      let dateLabel, gapLabel;
      if (t.gapDays === null) {
        dateLabel = `${fmt(t.outDate)} 이후`;
        gapLabel  = '다음 입실 미정';
      } else if (t.gapDays === 0) {
        dateLabel = `${fmt(t.outDate)} (당일 청소)`;
        gapLabel  = `${t.outGuest} 퇴실 → ${t.inGuest} 입실`;
      } else {
        dateLabel = `${fmt(t.outDate)} ~ ${fmt(t.nextIn)}`;
        gapLabel  = `${t.gapDays}일 · ${t.outGuest} 퇴실 → ${t.inGuest} 입실`;
      }
      html += `<div class="clean-item${done ? ' done' : ''}">
        <input type="checkbox" data-key="${key}" ${done ? 'checked' : ''} onchange="toggleClean(this)">
        <span class="clean-room">${t.room}</span>
        <span class="clean-dates">${dateLabel}</span>
        <span class="clean-gap">${gapLabel}</span>
      </div>`;
    }
    html += `</div>`;
    return html;
  }

  el.innerHTML =
    renderGroup(thisWeek, '🧹 이번 주 청소 (향후 7일)') +
    renderGroup(later,    '📅 이후 청소 일정');
}

      </div>`;
    }
  }

  // ── Days: today + 14 days ────────────────────────────────────────────────
  const horizon = 14;
  const eventsByDay = {};
  const activeRS = RS.filter(r => !isCancelled(r) && !isDone(r));
  for (const r of activeRS) {
    const inD  = d(r.in);
    const outD = d(r.out);
    const end  = new Date(todayD.getTime() + horizon * 86400000);
    if (inD >= todayD && inD <= end)  (eventsByDay[r.in]  = eventsByDay[r.in]  || []).push({...r, type:'in'});
    if (outD >= todayD && outD <= end) (eventsByDay[r.out] = eventsByDay[r.out] || []).push({...r, type:'out'});
  }
  const allDays = [...new Set(Object.keys(eventsByDay))].sort();
  if (!allDays.length) {
    wHTML += `<div class="empty">이후 2주 내 입퇴실 일정 없음</div>`;

    for (const ds of allDays) {

            : isIn ? `<span class="badge b-in">입실</span>` : `<span class="badge b-out">퇴실</span>`;

                   : isReq       ? ' <span style="font-size:10px;color:#dc2626">(응답기한 확인 필요)</span>'
                   : '';
        wHTML += `<div class="card ${cls}">

          <div class="card-amt">${money(e.amt)}</div>

      }
    }
  }
  document.getElementById('week-content').innerHTML = wHTML;

  // ── 전체 예약 테이블 ─────────────────────────────────────────────────────
  const horizonD = new Date(todayD.getTime() + 14 * 86400000);
  const sorted = [...RS].filter(r => d(r.out) >= todayD).sort((a, b) => d(a.in) - d(b.in));
  let tHTML = `<div class="tbl-wrap"><table>
    <thead><tr>

                   ? '<span style="color:#d97706;font-size:11px;font-weight:700">✉ 이메일확인 · SS미등록</span>'
                   : r.note === '이메일확인' ? '<span style="color:#888;font-size:11px">✉ 이메일확인</span>'
                   : r.note === '예약요청중' ? '<span style="color:#dc2626;font-size:11px;font-weight:700">⚠️ 예약요청중</span>'
                   : r.note.startsWith('취소')  ? `<span style="color:#dc2626;font-size:11px">${r.note}</span>`
                   : r.note === '퇴실완료_점검필요' ? '<span style="color:#dc2626;font-size:11px;font-weight:700">⚡점검필요</span>'
                   : r.note === '퇴실완료' ? '<span style="color:#aaa;font-size:11px">퇴실완료</span>'
                   : '';
    tHTML += `<tr class="${cls}">
      <td style="font-weight:600;white-space:nowrap">${r.room}</td>
      <td style="white-space:nowrap">${fmt(r.in)}</td>
      <td style="white-space:nowrap">${fmt(r.out)}</td>
      <td>${r.guest}</td>
      <td class="${platClass(r.p)}" style="white-space:nowrap">${r.p}</td>
      <td style="white-space:nowrap">${money(r.amt)}</td>
      <td>${noteHTML}</td>
    </tr>`;
  }
  tHTML += `</tbody></table></div>
    <div class="tbl-legend" style="margin-top:10px">
      🟦 현재 입실중 &nbsp;🟩 2주 이내 입실 예정 &nbsp;취소건 회색 처리 &nbsp;✉ 이메일확인 &nbsp;⚠️ SS미등록
    </div>`;
  document.getElementById('all-content').innerHTML = tHTML;
}

async function loadAlerts() {
  alertsLoaded = true;
  const el = document.getElementById('alerts-content');
  if (!window.cowork) { el.innerHTML = '<div class="empty">알림 로드 불가 (연결 안 됨)</div>'; return; }
  try {
    const r = await window.cowork.callMcpTool(
      'mcp__09738d3d-0b5e-4451-abbb-3521015cd178__search_threads',
      {query: 'from:(33m2@spacev.kr OR contact@liveanywhere.me) newer_than:14d', pageSize: 20}
    );
    const data = r.structuredContent ?? JSON.parse(r.content?.[0]?.text ?? '{}');
    const threads = data.threads ?? [];
    if (!threads.length) { el.innerHTML = '<div class="empty">최근 알림 없음</div>'; return; }
    const SKIP_KEYWORDS = ['퇴실점검', '보증금 반환', '보증금반환'];
    const filtered = threads.filter(t => {
      const subj = t.messages?.[0]?.subject ?? '';
      const snip = t.messages?.[0]?.snippet ?? '';
      return !SKIP_KEYWORDS.some(k => subj.includes(k) || snip.includes(k));
    });
    if (!filtered.length) { el.innerHTML = '<div class="empty">최근 알림 없음</div>'; return; }
    el.innerHTML = filtered.map(t => {
      const m = t.messages?.[0];
      if (!m) return '';
      const snippet = (m.snippet ?? '').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&#39;/g,"'").replace(/&amp;/g,'&');
      const unread = (m.labelIds ?? []).includes('UNREAD');
      const is33m2 = (m.sender ?? '').includes('33m2');
      const dt = new Date(m.date);
      const utc = dt.getTime() + dt.getTimezoneOffset() * 60000;
      const kstDt = new Date(utc + 9*3600000);
      const timeStr = `${kstDt.getMonth()+1}/${kstDt.getDate()} ${String(kstDt.getHours()).padStart(2,'0')}:${String(kstDt.getMinutes()).padStart(2,'0')}`;
      return `<div class="notif ${unread ? 'unread' : ''}">
        <div class="notif-from">
          ${is33m2 ? `<span class="badge b-33m2">삼삼엠투</span>` : `<span class="badge b-live">리브애니웨어</span>`}
          ${unread ? '<span class="unread-dot"></span><span style="font-size:10px;color:#3b82f6;font-weight:700">미읽음</span>' : ''}
        </div>
        <div class="notif-subj">${m.subject ?? ''}</div>
        <div class="notif-body">${snippet.slice(0, 160)}</div>
        <div class="notif-time">${timeStr} KST</div>
      </div>`;
    }).join('');
  } catch(e) {
    el.innerHTML = '<div class="empty">알림 로드 실패 — 새로고침 해주세요</div>';
  }
}

async function loadNewReservations() {
  const el = document.getElementById('new-reservations');
  if (!el) return;
  if (!window.cowork) { el.innerHTML = ''; return; }
  try {
    const r = await window.cowork.callMcpTool('mcp__09738d3d-0b5e-4451-abbb-3521015cd178__search_threads', {query: 'from:(33m2@spacev.kr OR contact@liveanywhere.me) newer_than:7d', pageSize: 20});
    const data = r.structuredContent ?? JSON.parse(r.content?.[0]?.text ?? '{}');
    const threads = (data.threads ?? []).filter(t => { const s = t.messages?.[0]?.subject ?? ''; const p = t.messages?.[0]?.snippet ?? ''; return !['퇴실점검','리뷰요청','정산','결제'].some(k => s.includes(k)||p.includes(k)); });
    if (!threads.length) { el.innerHTML = ''; return; }
    const sums = threads.map(t => '제목: '+(t.messages?.[0]?.subject??'')+' / 내용: '+(t.messages?.[0]?.snippet??'')).join(' ||| ');
    const parsed = await window.cowork.askClaude('다음 예약 이메일에서 지점명, 게스트이름, 입실일자(YYYY-MM-DD), 퇴실일자(YYYY-MM-DD), 플랫폼명을 추출해서 JSON 배열로만 반환. 예: [{"room":"여수남산","guest":"홍길동","in":"2026-08-20","out":"2026-08-25","platform":"삼삼얠투"}]. 확인 불가는 제외.\n\n'+sums, []);
    let rs = []; try { const m = parsed.match(/\[[\s\S]*?\]/); if(m) rs = JSON.parse(m[0]); } catch(e) {}
    if (!rs.length) { el.innerHTML = ''; return; }
    el.innerHTML = '<div class="alert" style="background:#f0fdf4;border-color:#86efac;margin-bottom:10px"><div class="alert-title" style="color:#166534">🆕 지난 7일 신규예약 ('+rs.length+'건)</div><div class="alert-body">'+rs.map(r=>'<b>'+(r.room||'-')+'</b> / '+(r.guest||'-')+' / '+((r.in||'').slice(5))+'~'+((r.out||'').slice(5))+' / '+(r.platform||'-')).join('<br>')+'</div></div>';
  } catch(e) { el.innerHTML = ''; }
}

render();
loadNewReservations();
</script>
