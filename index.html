function renderCleaningSchedule() {
  const todayStr = kstDateStr();
  const todayD   = d(todayStr);
  const week7D   = new Date(todayD.getTime() + 7 * 86400000);

  // All non-cancelled (including í‡´ì‹¤ì™„ë£Œ) â€” find upcoming checkouts from today
  const nonCancelled = RS.filter(r => !isCancelled(r));

  const tasks = [];
  for (const r of nonCancelled) {
    const outD = d(r.out);
    if (outD < todayD) continue;  // only today onwards

    // Next non-cancelled reservation for same room after this checkout
    const next = nonCancelled
      .filter(s => s.room === r.room && s !== r && d(s.in) >= outD)
      .sort((a, b) => d(a.in) - d(b.in))[0];

    const gapDays = next ? Math.round((d(next.in) - outD) / 86400000) : null;
    const isThisWeek = outD <= week7D;
    tasks.push({ room: r.room, outDate: r.out, nextIn: next ? next.in : null, gapDays, outGuest: r.guest, inGuest: next ? next.guest : null, isThisWeek });
  }
  tasks.sort((a, b) => a.outDate.localeCompare(b.outDate));

  const el = document.getElementById('clean-content');
  if (!tasks.length) { el.innerHTML = '<div class="empty" style="padding:16px">ì˜ˆì •ëœ ì²­ì†Œ ì¼ì • ì—†ìŒ</div>'; return; }

  // Split into this week vs later
  const thisWeek = tasks.filter(t => t.isThisWeek);
  const later    = tasks.filter(t => !t.isThisWeek);

  function renderGroup(list, title) {
    if (!list.length) return '';
    let html = `<div class="clean-section">
      <div class="clean-section-hdr">${title}</div>`;
    for (const t of list) {
      const done = isCleanDone(t.room, t.outDate);
      const key  = cleanKey(t.room, t.outDate);
      let dateLabel, gapLabel;
      if (t.gapDays === null) {
        dateLabel = `${fmt(t.outDate)} ì´í›„`;
        gapLabel  = 'ë‹¤ìŒ ìž…ì‹¤ ë¯¸ì •';
      } else if (t.gapDays === 0) {
        dateLabel = `${fmt(t.outDate)} (ë‹¹ì¼ ì²­ì†Œ)`;
        gapLabel  = `${t.outGuest} í‡´ì‹¤ â†’ ${t.inGuest} ìž…ì‹¤`;
      } else {
        dateLabel = `${fmt(t.outDate)} ~ ${fmt(t.nextIn)}`;
        gapLabel  = `${t.gapDays}ì¼ Â· ${t.outGuest} í‡´ì‹¤ â†’ ${t.inGuest} ìž…ì‹¤`;
      }
      html += `<div class="clean-item${done ? ' done' : ''}">
        <input type="checkbox" data-key="${key}" ${done ? 'checked' : ''} onchange="toggleClean(this)">
        <span class="clean-room">${t.room}</span>
        <span class="clean-dates">${dateLabel}</span>
        <span class="clean-gap">${gapLabel}</span>
      </div>`;
    }
    html += `</div>`;
    return html;
  }

  el.innerHTML =
    renderGroup(thisWeek, 'ðŸ§¹ ì´ë²ˆ ì£¼ ì²­ì†Œ (í–¥í›„ 7ì¼)') +
    renderGroup(later,    'ðŸ“… ì´í›„ ì²­ì†Œ ì¼ì •');
}

async function loadAlerts() {
  alertsLoaded = true;
  const el = document.getElementById('alerts-content');
  if (!window.cowork) { el.innerHTML = '<div class="empty">ì•Œë¦¼ ë¡œë“œ ë¶ˆê°€ (ì—°ê²° ì•ˆ ë¨)</div>'; return; }
  try {
    const r = await window.cowork.callMcpTool(
      'mcp__09738d3d-0b5e-4451-abbb-3521015cd178__search_threads',
      {query: 'from:(33m2@spacev.kr OR contact@liveanywhere.me) newer_than:14d', pageSize: 20}
    );
    const data = r.structuredContent ?? JSON.parse(r.content?.[0]?.text ?? '{}');
    const threads = data.threads ?? [];
    if (!threads.length) { el.innerHTML = '<div class="empty">ìµœê·¼ ì•Œë¦¼ ì—†ìŒ</div>'; return; }
    const SKIP_KEYWORDS = ['í‡´ì‹¤ì ê²€', 'ë³´ì¦ê¸ˆ ë°˜í™˜', 'ë³´ì¦ê¸ˆë°˜í™˜'];
    const filtered = threads.filter(t => {
      const subj = t.messages?.[0]?.subject ?? '';
      const snip = t.messages?.[0]?.snippet ?? '';
      return !SKIP_KEYWORDS.some(k => subj.includes(k) || snip.includes(k));
    });
    if (!filtered.length) { el.innerHTML = '<div class="empty">ìµœê·¼ ì•Œë¦¼ ì—†ìŒ</div>'; return; }
    el.innerHTML = filtered.map(t => {
      const m = t.messages?.[0];
      if (!m) return '';
      const snippet = (m.snippet ?? '').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&#39;/g,"'").replace(/&amp;/g,'&');
      const unread = (m.labelIds ?? []).includes('UNREAD');

        </div>

    }).join('');
  } catch(e) {
    el.innerHTML = '<div class="empty">ì•Œë¦¼ ë¡œë“œ ì‹¤íŒ¨ â€” ìƒˆë¡œê³ ì¹¨ í•´ì£¼ì„¸ìš”</div>';

}

function renderRevenue() {
  const k = kst();
  const curM  = k.getMonth();
  const MONTHS_KR = ['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
  const active = RS_CAL.filter(r => !isCancelled(r) && r.amt > 0);
  const byMonth = Array.from({length: 12}, () => ({ rev: 0, count: 0 }));
  for (const r of active) {
    const m = parseInt(r.in.slice(5,7)) - 1;
    byMonth[m].rev   += r.amt;
    byMonth[m].count += 1;
  }
  const curRev  = byMonth[curM].rev;
  const prevRev = curM > 0 ? byMonth[curM - 1].rev : 0;
  const totalRev = active.reduce((s, r) => s + r.amt, 0);
  const ytd = byMonth.slice(0, curM + 1).reduce((s, x) => s + x.rev, 0);
  const pct = prevRev > 0 ? ((curRev - prevRev) / prevRev * 100) : null;
  function changeBadge(val) {
    if (val === null) return '<span class="rev-badge-neu">-</span>';
    if (val >= 0) return `<span class="rev-badge-up">▲ ${val.toFixed(1)}%</span>`;
    return `<span class="rev-badge-down">▼ ${Math.abs(val).toFixed(1)}%</span>`;
  }
  const byRoom = {};
  for (const r of active) {
    if (!byRoom[r.room]) byRoom[r.room] = { rev: 0, count: 0 };
    byRoom[r.room].rev   += r.amt;
    byRoom[r.room].count += 1;
  }
  const byRoomCur = {};
  for (const r of active) {
    const m = parseInt(r.in.slice(5,7)) - 1;
    if (m !== curM) continue;
    if (!byRoomCur[r.room]) byRoomCur[r.room] = { rev: 0, count: 0 };
    byRoomCur[r.room].rev   += r.amt;
    byRoomCur[r.room].count += 1;
  }
  const roomList = Object.entries(byRoom).sort((a, b) => b[1].rev - a[1].rev);
  const maxMonthRev = Math.max(...byMonth.map(x => x.rev), 1);
  let html = '';
  html += `<div class="rev-kpi-row">
    <div class="rev-kpi highlight">
      <div class="rev-kpi-label">이달 매출 (${MONTHS_KR[curM]})</div>
      <div class="rev-kpi-val">${money(curRev)}</div>
      <div class="rev-kpi-sub">${changeBadge(pct)} 전월대비</div>
    </div>
    <div class="rev-kpi">
      <div class="rev-kpi-label">전월 매출 (${curM > 0 ? MONTHS_KR[curM-1] : '-'})</div>
      <div class="rev-kpi-val">${money(prevRev)}</div>
      <div class="rev-kpi-sub" style="color:#888">기준월</div>
    </div>
    <div class="rev-kpi">
      <div class="rev-kpi-label">연간 누계 (${MONTHS_KR[0]}~${MONTHS_KR[curM]})</div>
      <div class="rev-kpi-val">${money(ytd)}</div>
      <div class="rev-kpi-sub" style="color:#888">확정 예약 합산</div>
    </div>
    <div class="rev-kpi">
      <div class="rev-kpi-label">2026 전체 확정 매출</div>
      <div class="rev-kpi-val">${money(totalRev)}</div>
      <div class="rev-kpi-sub" style="color:#888">${active.length}건 · 취소 제외</div>
    </div>
  </div>`;
  html += `<div class="rev-section-hdr">📊 월별 매출 (입실 기준)</div>`;
  html += `<div class="rev-chart">`;
  for (let m = 0; m < 12; m++) {
    const { rev, count } = byMonth[m];
    const pctBar = Math.round(rev / maxMonthRev * 100);
    const isCur = m === curM;
    const isFut = m > curM;
    const fillCls = isCur ? 'current' : (isFut ? 'future' : '');
    let changeHint = '';
    if (m > 0 && byMonth[m-1].rev > 0 && rev > 0) {
      const chg = ((rev - byMonth[m-1].rev) / byMonth[m-1].rev * 100);
      changeHint = chg >= 0
        ? `<span style="font-size:10px;color:#15803d;margin-left:4px">▲${chg.toFixed(0)}%</span>`
        : `<span style="font-size:10px;color:#dc2626;margin-left:4px">▼${Math.abs(chg).toFixed(0)}%</span>`;
    }
    html += `<div class="rev-bar-group${isCur ? ' current' : ''}">
      <div class="rev-bar-label">${MONTHS_KR[m]}</div>
      <div class="rev-bar-track"><div class="rev-bar-fill ${fillCls}" style="width:${pctBar}%"></div></div>
      <div class="rev-bar-amt">${rev > 0 ? money(rev) : '<span style="color:#ddd">-</span>'}${changeHint}</div>
    </div>`;
  }
  html += `</div>`;
  html += `<div class="rev-section-hdr">🏠 지점별 매출 (연간 합계)</div>`;
  html += `<div class="tbl-wrap"><table><thead><tr>
    <th>지점</th><th style="text-align:right">연간 매출</th><th style="text-align:right">건수</th>
    <th style="text-align:right">비중</th><th style="text-align:right">이달</th><th style="min-width:80px">구성비</th>
  </tr></thead><tbody>`;
  for (const [room, { rev, count }] of roomList) {
    const share = totalRev > 0 ? (rev / totalRev * 100) : 0;
    const barW = Math.round(share);
    const curRoomRev = byRoomCur[room]?.rev || 0;
    html += `<tr>
      <td style="font-weight:600;white-space:nowrap">${room}</td>
      <td style="text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap">${money(rev)}</td>
      <td style="text-align:right;color:#888">${count}건</td>
      <td style="text-align:right;color:#888;white-space:nowrap">${share.toFixed(1)}%</td>
      <td style="text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;color:${curRoomRev?'#2563eb':'#ddd'}">${curRoomRev?money(curRoomRev):'-'}</td>
      <td><div class="rev-mini-bar" style="width:${barW}%;opacity:0.7"></div></td>
    </tr>`;
  }
  html += `</tbody></table></div>`;
  html += `<div class="rev-section-hdr">📈 전월대비 매출 변동</div>`;
  html += `<div class="tbl-wrap"><table><thead><tr>
    <th>월</th><th style="text-align:right">매출</th><th style="text-align:right">전월비</th><th style="text-align:right">증감액</th>
  </tr></thead><tbody>`;
  for (let m = 0; m < 12; m++) {
    if (byMonth[m].rev === 0 && (m === 0 || byMonth[m-1].rev === 0)) continue;
    const prev = m > 0 ? byMonth[m-1].rev : 0;
    const cur  = byMonth[m].rev;
    const diff = cur - prev;
    const chg  = prev > 0 ? ((diff / prev) * 100) : null;
    const isCurM = m === curM;
    html += `<tr style="${isCurM?'background:#eff6ff;font-weight:600':''}">
      <td style="white-space:nowrap">${MONTHS_KR[m]}${isCurM?' ← 현재':''}</td>
      <td style="text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap">${cur>0?money(cur):'-'}</td>
      <td style="text-align:right">${changeBadge(chg)}</td>
      <td style="text-align:right;white-space:nowrap;color:${diff>=0?'#15803d':'#dc2626'}">${diff!==0&&prev>0?(diff>0?'+':'')+money(Math.abs(diff)):'-'}</td>
    </tr>`;
  }
  html += `</tbody></table></div>`;
  html += `<div class="tbl-legend" style="margin-top:16px">※ 입실일 기준 월 집계 · 취소 건 및 0원 건 제외</div>`;
  document.getElementById('rev-content').innerHTML = html;
}

render();
</script>
