<!DOCTYPE html>
<meta charset="UTF-8">
<html lang="ko">
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>유휴하우스 예약현황</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f5;color:#111;font-size:14px}
header{background:#1a1a2e;color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
header h1{font-size:16px;font-weight:700}
.updated{font-size:11px;color:#aaa}
.tabs{display:flex;background:#fff;border-bottom:2px solid #e5e7eb;overflow-x:auto}
.tab-btn{padding:10px 18px;border:none;background:transparent;cursor:pointer;font-size:13px;font-weight:600;color:#6b7280;white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-2px}
.tab-btn.active{color:#1a1a2e;border-bottom-color:#1a1a2e}
.panel{display:none;padding:12px}
.panel.active{display:block}
.today-banner{background:#dbeafe;border:1px solid #93c5fd;border-radius:8px;padding:10px 14px;margin-bottom:12px;font-size:13px;font-weight:600;color:#1e40af}
.checkin-list,.checkout-list,.stay-list{margin-bottom:16px}
.section-label{font-size:11px;font-weight:700;text-transform:uppercase;color:#9ca3af;margin-bottom:6px;letter-spacing:.5px}
.res-card{background:#fff;border-radius:8px;border:1px solid #e5e7eb;padding:10px 12px;margin-bottom:6px;display:flex;align-items:center;gap:10px}
.res-card .room-name{font-weight:700;font-size:13px;min-width:72px;color:#1a1a2e}
.res-card .guest-info{flex:1;font-size:12px;color:#374151}
.res-card .amt{font-size:12px;color:#059669;font-weight:600;white-space:nowrap}
.badge{display:inline-block;font-size:10px;padding:2px 6px;border-radius:99px;font-weight:600}
.badge-in{background:#d1fae5;color:#065f46}
.badge-out{background:#fee2e2;color:#991b1b}
.badge-stay{background:#e0e7ff;color:#3730a3}
.badge-req{background:#fef3c7;color:#92400e}
.badge-done{background:#f3f4f6;color:#6b7280}
.res-table{width:100%;border-collapse:collapse;background:#fff;border-radius:8px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.res-table th{background:#f9fafb;font-size:11px;font-weight:700;color:#6b7280;padding:8px 10px;text-align:left;border-bottom:1px solid #e5e7eb;white-space:nowrap}
.res-table td{padding:8px 10px;border-bottom:1px solid #f3f4f6;font-size:12px;vertical-align:middle}
.res-table tr:last-child td{border-bottom:none}
.res-table tr:hover td{background:#f9fafb}
.cal-grid{display:grid;gap:2px;margin-bottom:8px}
.cal-room-label{font-size:10px;font-weight:700;color:#1a1a2e;display:flex;align-items:center;padding-right:4px;justify-content:flex-end}
.cal-cell{height:28px;border-radius:3px;position:relative;overflow:hidden;cursor:default}
.month-nav{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.month-nav button{background:#fff;border:1px solid #e5e7eb;border-radius:6px;padding:4px 10px;cursor:pointer;font-size:12px}
.month-nav span{font-size:14px;font-weight:700;min-width:80px;text-align:center}
.empty-msg{padding:24px;text-align:center;color:#9ca3af;font-size:13px}
@media(max-width:600px){
  .res-table th:nth-child(4),.res-table td:nth-child(4),
  .res-table th:nth-child(5),.res-table td:nth-child(5){display:none}
}
</style>
</head>
<body>
<header>
  <h1>🏠 유휴하우스 예약현황</h1>
  <span class="updated" id="updated-label">로딩 중...</span>
</header>
<div class="tabs">
  <button class="tab-btn active" onclick="showTab('week')">이번주일정</button>
  <button class="tab-btn" onclick="showTab('all')">전체일정</button>
  <button class="tab-btn" onclick="showTab('cal')">연간달력</button>
</div>
<div id="panel-week" class="panel active"></div>
<div id="panel-all" class="panel"></div>
<div id="panel-cal" class="panel"></div>
<script>
let RS = [], RS_CAL = [];
let calYear = new Date().getFullYear();
let calMonth = new Date().getMonth();

function isCancelled(r) { return r.note && r.note.startsWith('취소'); }
function isDone(r) { return r.note === '퇴실완료' || r.note === '퇴실완료_점검필요'; }
function d(s) { return s ? new Date(s) : null; }
function formatAmt(n) { if (!n) return ''; return '₩' + n.toLocaleString(); }
function formatDate(s) {
  if (!s) return '';
  const dt = new Date(s);
  return (dt.getMonth()+1) + '/' + dt.getDate();
}
function platformShort(p) {
  if (!p) return '';
  if (p.includes('삼삼') || p.includes('33')) return '삼';
  if (p.includes('리브')) return '리';
  if (p.includes('직')) return '직';
  if (p.includes('연장')) return '연';
  if (p.includes('홈')) return '홈';
  return p.slice(0,2);
}
function showTab(name) {
  document.querySelectorAll('.tab-btn').forEach((b,i) => {
    b.classList.toggle('active', ['week','all','cal'][i] === name);
  });
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.getElementById('panel-' + name).classList.add('active');
}
function renderWeek() {
  const today = new Date(); today.setHours(0,0,0,0);
  const in14 = new Date(today); in14.setDate(in14.getDate()+14);
  const active = RS.filter(r => !isCancelled(r) && !isDone(r) && d(r.in) <= today && d(r.out) > today);
  const incoming = RS.filter(r => !isCancelled(r) && d(r.in) >= today && d(r.in) <= in14);
  const outgoing = RS.filter(r => !isCancelled(r) && d(r.out) >= today && d(r.out) <= in14);
  const todayStr = today.toLocaleDateString('ko-KR', {year:'numeric',month:'long',day:'numeric',weekday:'long'});
  let html = '<div class="today-banner">📅 ' + todayStr + ' — 현재 체류 ' + active.length + '건</div>';
  if (active.length) {
    html += '<div class="section-label">체류 중</div>';
    active.forEach(r => {
      html += '<div class="res-card"><span class="badge badge-stay">체류</span>'
        + '<span class="room-name">' + r.room + '</span>'
        + '<span class="guest-info">' + r.guest + ' · ' + formatDate(r.in) + '~' + formatDate(r.out) + ' · ' + platformShort(r.p) + '</span>'
        + '<span class="amt">' + formatAmt(r.amt) + '</span></div>';
    });
  }
  if (incoming.length) {
    html += '<div class="section-label" style="margin-top:12px">14일내 입실</div>';
    incoming.sort((a,b) => new Date(a.in)-new Date(b.in)).forEach(r => {
      const nl = r.note === '예약요청중' ? '<span class="badge badge-req">요청중</span> ' : '';
      html += '<div class="res-card"><span class="badge badge-in">입실</span>'
        + '<span class="room-name">' + r.room + '</span>'
        + '<span class="guest-info">' + nl + r.guest + ' · ' + formatDate(r.in) + '~' + formatDate(r.out) + ' · ' + platformShort(r.p) + '</span>'
        + '<span class="amt">' + formatAmt(r.amt) + '</span></div>';
    });
  }
  if (outgoing.length) {
    html += '<div class="section-label" style="margin-top:12px">14일내 퇴실</div>';
    outgoing.sort((a,b) => new Date(a.out)-new Date(b.out)).forEach(r => {
      const nl = r.note === '퇴실완료_점검필요' ? '<span class="badge" style="background:#fee2e2;color:#991b1b">점검필요</span> ' : '';
      html += '<div class="res-card"><span class="badge badge-out">퇴실</span>'
        + '<span class="room-name">' + r.room + '</span>'
        + '<span class="guest-info">' + nl + r.guest + ' · ' + formatDate(r.in) + '~' + formatDate(r.out) + ' · ' + platformShort(r.p) + '</span>'
        + '<span class="amt">' + formatAmt(r.amt) + '</span></div>';
    });
  }
  if (!active.length && !incoming.length && !outgoing.length) html += '<div class="empty-msg">14일내 일정 없음</div>';
  document.getElementById('panel-week').innerHTML = html;
}
function renderAll() {
  const today = new Date(); today.setHours(0,0,0,0);
  const sorted = [...RS].filter(r => !isCancelled(r) && d(r.out) >= today).sort((a,b) => new Date(a.in)-new Date(b.in));
  if (!sorted.length) { document.getElementById('panel-all').innerHTML = '<div class="empty-msg">예정 예약 없음</div>'; return; }
  let html = '<table class="res-table"><thead><tr><th>객실</th><th>입실</th><th>퇴실</th><th>예약자</th><th>플랫폼</th><th>금액</th><th>비고</th></tr></thead><tbody>';
  sorted.forEach(r => {
    const nl = r.note ? '<span class="badge" style="background:#f3f4f6;color:#374151">' + r.note + '</span>' : '';
    html += '<tr><td><strong>' + r.room + '</strong></td><td>' + r.in + '</td><td>' + r.out + '</td><td>' + r.guest + '</td><td>' + r.p + '</td><td>' + formatAmt(r.amt) + '</td><td>' + nl + '</td></tr>';
  });
  html += '</tbody></table>';
  document.getElementById('panel-all').innerHTML = html;
}
function renderCal() {
  const panel = document.getElementById('panel-cal');
  const year = calYear, month = calMonth;
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const today = new Date(); today.setHours(0,0,0,0);
  const rooms = [...new Set(RS_CAL.filter(r => !isCancelled(r)).map(r => r.room))].sort();
  const monthNames = ['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
  let html = '<div class="month-nav">'
    + '<button onclick="calMonth--;if(calMonth<0){calMonth=11;calYear--;}renderCal()">◀</button>'
    + '<span>' + year + '년 ' + monthNames[month] + '</span>'
    + '<button onclick="calMonth++;if(calMonth>11){calMonth=0;calYear++;}renderCal()">▶</button></div>';
  const dayNames = ['월','화','수','목','금','토','일'];
  html += '<div style="overflow-x:auto"><div>';
  html += '<div style="display:grid;grid-template-columns:64px repeat(' + daysInMonth + ',28px);gap:1px;margin-bottom:2px"><div></div>';
  for (let day = 1; day <= daysInMonth; day++) {
    const dt = new Date(year, month, day);
    const dow = (dt.getDay()+6)%7;
    const isToday = dt.getTime() === today.getTime();
    const color = isToday ? '#ef4444' : dow===6 ? '#ef4444' : dow===5 ? '#3b82f6' : '#6b7280';
    html += '<div style="text-align:center;font-size:9px;font-weight:700;color:' + color + '">' + day + '<br>' + dayNames[dow] + '</div>';
  }
  html += '</div>';
  rooms.forEach(room => {
    const roomRS = RS_CAL.filter(r => r.room === room && !isCancelled(r));
    html += '<div style="display:grid;grid-template-columns:64px repeat(' + daysInMonth + ',28px);gap:1px;margin-bottom:1px">';
    html += '<div style="font-size:10px;font-weight:700;color:#1a1a2e;display:flex;align-items:center;justify-content:flex-end;padding-right:4px;overflow:hidden">' + room + '</div>';
    for (let day = 1; day <= daysInMonth; day++) {
      const dt = new Date(year, month, day); dt.setHours(0,0,0,0);
      const bk = roomRS.find(r => { const i=new Date(r.in); i.setHours(0,0,0,0); const o=new Date(r.out); o.setHours(0,0,0,0); return dt>=i && dt<o; });
      const isToday = dt.getTime() === today.getTime();
      let cellColor = '#f9fafb', label = '', border = '1px solid #e5e7eb';
      if (bk) {
        const inD = new Date(bk.in); inD.setHours(0,0,0,0);
        if (dt.getTime() === inD.getTime()) { cellColor='#10b981'; label=bk.guest.slice(0,3); border='1px solid transparent'; }
        else { cellColor='#818cf8'; border='1px solid transparent'; }
      }
      const todayOutline = isToday ? 'outline:2px solid #ef4444;outline-offset:-1px;' : '';
      const title = bk ? bk.guest + ' ' + bk.in + '~' + bk.out : '';
      html += '<div style="height:22px;border-radius:2px;background:' + cellColor + ';border:' + border + ';' + todayOutline + 'overflow:hidden;font-size:8px;color:#fff;font-weight:700;line-height:22px;padding:0 2px" title="' + title + '">' + label + '</div>';
    }
    html += '</div>';
  });
  html += '</div></div>';
  panel.innerHTML = html;
}
function renderAll3() { renderWeek(); renderAll(); renderCal(); }
fetch('./data.json?_=' + Date.now())
  .then(r => { if (!r.ok) throw new Error('data.json ' + r.status); return r.json(); })
  .then(data => {
    RS = data.reservations || [];
    RS_CAL = RS;
    document.getElementById('updated-label').textContent = '업데이트: ' + (data.updated || '?');
    renderAll3();
  })
  .catch(err => {
    document.getElementById('updated-label').textContent = '오류: ' + err.message;
    document.getElementById('panel-week').innerHTML = '<div class="empty-msg">데이터 로드 실패: ' + err.message + '</div>';
  });
</script>
</body>
</html>
